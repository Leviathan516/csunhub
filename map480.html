<!DOCTYPE HTML>
<!--
  CSUN Campus Resource Hub - Campus Map
-->
<html lang="en">
  <head>
    <title>Campus Map | CSUN Campus Resource Hub</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <!-- Phantom main stylesheet -->
    <link rel="stylesheet" href="assets/css/main.css" />
    <noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>

    <!-- Map-specific styling -->
    <style>
      .map-layout {
        display: grid;
        grid-template-columns: minmax(0, 2.5fr) minmax(260px, 1fr);
        gap: 2rem;
        align-items: flex-start;
      }

      @media (max-width: 900px) {
        .map-layout {
          grid-template-columns: 1fr;
        }
      }

      #map {
        width: 100%;
        min-height: 450px;
        border-radius: 1rem;
        overflow: hidden;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.12);
      }

      #controls {
        background: #ffffff;
        border-radius: 1rem;
        padding: 1.25rem 1.5rem;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.18);
      }

      #controls h3 {
        margin: 0 0 0.75rem 0;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-size: 0.75rem;
      }

      .control-button {
        display: block;
        width: 100%;
        margin-bottom: 0.5rem;
        border-radius: 999px;
        border: 1px solid #d1d5db;
        padding: 0.55rem 0.9rem;
        font-size: 0.85rem;
        text-align: center;
        cursor: pointer;
        background: #f9fafb;
        transition: background 0.15s ease, border-color 0.15s ease,
          transform 0.08s ease;
      }

      .control-button:last-child {
        margin-bottom: 0;
      }

      .control-button:hover {
        transform: translateY(-1px);
      }

      .control-button.active {
        background: #d22030; /* CSUN Hero Red */
        color: #ffffff;
        border-color: #b11b27;
      }
    </style>
  </head>

  <body class="is-preload">
    <!-- Wrapper -->
    <div id="wrapper">
      <!-- Header -->
      <header id="header">
        <div class="inner">
          <!-- Logo -->
          <a href="index.html" class="logo">
            <span class="symbol">
              <img src="images/CSUNlogo.png" alt="CSUN Logo" />
            </span>
            <span class="title">CSUN Campus Resource Hub</span>
          </a>

          <!-- Nav trigger -->
          <nav>
            <ul>
              <li><a href="#menu">Menu</a></li>
            </ul>
          </nav>
        </div>
      </header>

      <!-- Off-canvas Menu -->
      <nav id="menu">
        <h2>Menu</h2>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="dashboard480.html">Student Dashboard</a></li>
          <li><a href="map480.html">Campus Map</a></li>
          <li><a href="dining480.html">Dining</a></li>
          <li><a href="clubs480.html">Clubs &amp; Orgs</a></li>
          <li><a href="career480.html">Careers</a></li>
          <li><a href="signup.html">Sign Up / Login</a></li>
          <li><a href="#" onclick="logout()">Logout</a></li>
        </ul>
      </nav>

      <!-- Main -->
      <div id="main">
        <div class="inner">
          <header>
            <h1>CSUN Campus Map</h1>
            <p>
              Explore food, parking, and academic buildings around CSUN using
              interactive map layers.
            </p>
          </header>

          <section class="map-layout">
            <!-- Map -->
            <div id="map"></div>

            <!-- Layer controls -->
            <div id="controls">
              <h3>Map Layers</h3>
              <button id="food-btn" class="control-button active">Food</button>
              <button id="parking-btn" class="control-button">Parking</button>
              <button id="buildings-btn" class="control-button">Buildings</button>
            </div>
          </section>
        </div>
      </div>
    </div>

    <!-- Phantom Scripts -->
    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/browser.min.js"></script>
    <script src="assets/js/breakpoints.min.js"></script>
    <script src="assets/js/util.js"></script>
    <script src="assets/js/main.js"></script>

    <!-- Simple logout helper (used in the menu) -->
    <script>
      function logout() {
        localStorage.removeItem("authToken");
        localStorage.removeItem("username");
        localStorage.removeItem("major");
        localStorage.removeItem("catalogYear");
        window.location.href = "login.html";
      }
    </script>

    <!-- Google Maps JS + your existing map script -->
    <script>
      (g => {
        var h, a, k,
          p = "The Google Maps JavaScript API",
          c = "google",
          l = "importLibrary",
          q = "__ib__",
          m = document,
          b = window;
        b = b[c] || (b[c] = {});
        var d = b.maps || (b.maps = {}),
          r = new Set(),
          e = new URLSearchParams(),
          u = () =>
            h ||
            (h = new Promise(async (f, n) => {
              await (a = m.createElement("script"));
              e.set("libraries", [...r] + "");
              for (k in g)
                e.set(
                  k.replace(/[A-Z]/g, t => "_" + t[0].toLowerCase()),
                  g[k]
                );
              e.set("callback", c + ".maps." + q);
              a.src = `https://maps.googleapis.com/maps/api/js?` + e;
              d[q] = f;
              a.onerror = () => (h = n(Error(p + " could not load.")));
              a.nonce = m.querySelector("script[nonce]")?.nonce || "";
              m.head.append(a);
            }));
        d[l]
          ? console.warn(p + " only loads once. Ignoring:", g)
          : (d[l] = (f, ...n) =>
              r.add(f) && u().then(() => d[l](f, ...n)));
      })({
        key: "YOUR_API_KEY_HERE",
        v: "weekly"
      });
    </script>
    <script src="../js/mapscript.js"></script>
  </body>
</html>
