<!DOCTYPE HTML>
<html>
  <head>
    <title>Log In | CSUN Campus Resource Hub</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
  </head>
  <body class="is-preload">

  <header>
  <nav class="navbar">
    <div class="title">Campus Resource Hub</div>
    <ul class="nav-links">
      <li><a href="home480.html">Home</a></li>
      <li><a href="map480.html">Map</a></li>
      <li><a href="dining480.html">Dining</a></li>
      <li><a href="clubs480.html">Clubs</a></li>
      <li><a href="career480.html">Careers</a></li>
      <li class="dropdown">
        <button class="dropdown-btn">Account ▾</button>
        <div class="dropdown-content">
          <a href="login.html">Login</a>
          <a href="signup.html">Sign Up</a>
        </div>
      </li>
    </ul>
  </nav>

  <script>
    // dropdown toggle logic
    document.addEventListener("DOMContentLoaded", () => {
      const btn = document.querySelector(".dropdown-btn");
      const menu = document.querySelector(".dropdown-content");

      btn.addEventListener("click", () => {
        menu.classList.toggle("show");
      });

      // close dropdown when clicking outside
      window.addEventListener("click", (e) => {
        if (!btn.contains(e.target)) {
          menu.classList.remove("show");
        }
      });
    });
  </script>
</header>

    <div id="wrapper">
      <header id="header">
        <div class="inner">
          <h1>CSUN Campus Resource Hub</h1>
          <p>Log in to access your dashboard</p>
        </div>
      </header>

      <div id="main">
        <div class="inner">
          <section>
            <h2>Log In</h2>
            <form id="loginForm">
              <div class="fields">
                <div class="field">
                  <label for="username">Username</label>
                  <input type="text" id="username" required />
                </div>
                <div class="field">
                  <label for="password">Password</label>
                  <input type="password" id="password" required />
                </div>
              </div>

              <ul class="actions">
                <li>
                  <button type="button" class="primary" id="loginButton">Log In</button>
                </li>
              </ul>

              <p id="message" style="margin-top: 1rem;"></p>

              <p>
                Need an account?
                <a href="signup.html">Sign up here</a>.
              </p>
            </form>
          </section>
        </div>
      </div>
    </div>

    <!-- Render backend auth (no AWS Amplify) -->
    <script>
      const API_URL = "https://csunhub-backend.onrender.com";

      const messageEl = document.getElementById("message");
      const loginBtn = document.getElementById("loginButton");

      loginBtn.addEventListener("click", async () => {
        messageEl.textContent = "";

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        if (!username || !password) {
          messageEl.textContent = "Please enter your username and password.";
          return;
        }

        try {
          const res = await fetch(`${API_URL}/login`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ username, password })
          });

          const data = await res.json().catch(() => ({}));

          if (!res.ok || data.success === false) {
            throw new Error(data.message || "Login failed.");
          }

          console.log("Login success:", data);

          // Store auth info in localStorage
          if (data.token) {
            localStorage.setItem("authToken", data.token);
          } else {
            // fallback token so dashboard lock still works (you can remove later)
            localStorage.setItem("authToken", "dummy-token");
          }

          // Optional profile info (if your backend returns it)
          localStorage.setItem("username", data.username || username);
          if (data.major) localStorage.setItem("major", data.major);
          if (data.catalogYear) localStorage.setItem("catalogYear", data.catalogYear);

          // Go to dashboard once logged in
          const params = new URLSearchParams(window.location.search);
          const redirect = params.get("redirect") || "dashboard480.html";
          window.location.href = redirect;
        } catch (err) {
          console.error("Login error:", err);
          messageEl.textContent = err.message || "Error logging in.";
        }
      });
    </script>
  </body>
</html>
