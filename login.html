<!DOCTYPE HTML>
<html>
  <head>
    <title>Log In | CSUN Campus Resource Hub</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  </head>
  <body class="is-preload">
    <!-- Wrapper -->
    <div id="wrapper">
      <!-- Header -->
      <header id="header">
        <div class="inner">
          <!-- Logo -->
          <a href="index.html" class="logo">
            <span class="symbol">
              <img src="images/CSUNlogo.png" alt="CSUN Logo" />
            </span>
            <span class="title">CSUN Campus Resource Hub</span>
          </a>

          <!-- Nav trigger -->
          <nav>
            <ul>
              <li><a href="#menu">Menu</a></li>
            </ul>
          </nav>
        </div>
      </header>

      <!-- Off-canvas Menu -->
      <nav id="menu">
        <h2>Menu</h2>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="dashboard480.html">Student Dashboard</a></li>
          <li><a href="map480.html">Campus Map</a></li>
          <li><a href="dining480.html">Dining</a></li>
          <li><a href="clubs480.html">Clubs &amp; Orgs</a></li>
          <li><a href="career480.html">Careers</a></li>
          <li><a href="signup.html">Sign Up / Login</a></li>
          <li><a href="#" onclick="logout()">Logout</a></li>
        </ul>
      </nav>

      <div id="main">
        <div class="inner">
          <section>
            <h2>Log In</h2>
            <form id="loginForm">
              <div class="fields">
                <div class="field">
                  <label for="email">Email</label>
                  <input type="email" id="email" required />
                </div>
                <div class="field">
                  <label for="password">Password</label>
                  <input type="password" id="password" required />
                </div>
              </div>

              <ul class="actions">
                <li>
                  <button type="button" class="primary" id="loginButton">Log In</button>
                </li>
              </ul>

              <p id="message" style="margin-top: 1rem;"></p>

              <p>
                Need an account?
                <a href="signup.html">Sign up here</a>.
              </p>
            </form>
          </section>
        </div>
      </div>
    </div>

    <!-- Firebase Initialization and Auth -->
    <script>
      // Your web app's Firebase configuration
      const firebaseConfig = {
  apiKey: "AIzaSyClTeS_q66bYQkVEOcSoc-TY3VX4QRKeho",
  authDomain: "csunhub.firebaseapp.com",
  projectId: "csunhub",
  storageBucket: "csunhub.firebasestorage.app",
  messagingSenderId: "310029268686",
  appId: "1:310029268686:web:f2ce71516f1f82e166829f",
  measurementId: "G-ZEM4D9Y5XB"
};

      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();

      const messageEl = document.getElementById("message");
      const loginBtn = document.getElementById("loginButton");

      loginBtn.addEventListener("click", async () => {
        messageEl.textContent = "";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
          messageEl.textContent = "Please enter your email and password.";
          return;
        }

        try {
          const userCredential = await auth.signInWithEmailAndPassword(email, password);
          const user = userCredential.user;

          console.log("Login success:", user);

          // Go to dashboard once logged in
          const params = new URLSearchParams(window.location.search);
          const redirect = params.get("redirect") || "dashboard480.html";
          window.location.href = redirect;
        } catch (error) {
          console.error("Login error:", error);
          messageEl.textContent = error.message;
        }
      });

      function logout() {
        auth.signOut().then(() => {
          // Sign-out successful.
          localStorage.removeItem("authToken");
          localStorage.removeItem("username");
          localStorage.removeItem("major");
          localStorage.removeItem("catalogYear");
          window.location.href = "login.html";
        }).catch((error) => {
          // An error happened.
          console.error("Logout error:", error);
        });
      }
    </script>
  </body>
</html>
